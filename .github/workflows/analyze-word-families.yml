name: Analyze NGSL and NAWL word families

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/NGSL_1.2.txt'
      - 'data/NAWL_1.2.txt'
      - 'scripts/analyze_word_families.py'
      - '.github/workflows/analyze-word-families.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzer dependencies
        run: python -m pip install --disable-pip-version-check nltk wordfreq

      - name: Analyze overlap, families, and study difficulty
        run: python scripts/analyze_word_families.py

      - name: Commit analysis files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/
          if git diff --cached --quiet; then
            echo 'No analysis changes to commit.'
          else
            git commit -m 'Update NGSL-NAWL analysis and difficulty groups'
            git push
          fi
